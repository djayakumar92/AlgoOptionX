[underlying]
symbol = "NIFTY"
segment = "IDX_I"
# Number of expiries (from nearest) to track in the option chain.
expiries_tracked = 1
# Strikes to show on either side of ATM in the dashboard table.
strike_window = 10

[polling]
# Seconds between option-chain polls per (underlying, expiry). Must stay >= 3.0
# (DhanHQ's hard rate limit); padded above it to avoid clock-drift 429s.
option_chain_interval_sec = 3.5
# Seconds between historical-candle catch-up refreshes.
historical_refresh_interval_sec = 60

[historical]
intraday_interval_min = 5
backfill_days = 90

[hlc]
# Buyer/seller domination threshold in points, from the user's spreadsheet
# (nifty_options_trading.xlsx) -- fixed for now, may become IV-dependent later.
# The HLC page fetches once at startup and again only when the user clicks
# "Fetch Latest" -- see dhan_analyzer/api/hlc_worker.py -- since the read is
# the last *completed* trading day's data, not something that changes while
# the app sits open.
threshold_points = 35

[trade_plan]
# Daily premium-point target and trade cap for build_trade_plan() -- see
# dhan_analyzer/signals/hlc_strategy.py. Confirmed with the user: 20 points
# total per day, whether from one trade or split across two.
target_points_per_day = 20
max_trades_per_day = 2

[risk]
# Used only for position-sizing/risk display -- this app never places
# orders, so nothing here can misfire a trade, only misinform the sizing
# numbers shown. Update `capital` to your real trading capital.
capital = 500000
# Fraction of capital risked per trade before the time-of-day multiplier
# (see dhan_analyzer/signals/risk.py) reduces it further in higher-gamma
# windows (opening, closing, expiry day).
max_risk_pct_per_trade = 0.01
# Fraction of capital treated as the daily loss limit for the "how much
# budget is left" read on the most recently graded trading day.
max_daily_loss_pct = 0.02

[storage]
db_path = "data/dhan_analyzer.db"
# How many days of raw option-chain poll snapshots to keep. Nothing in the app
# reads this table beyond the current session or the last couple of polls --
# it's a debugging safety margin, not a data source. Pruned once at startup.
retention_days = 14

[logging]
level = "INFO"
log_dir = "logs"

[execution]
# The only supported mode. Live execution is intentionally unavailable.
mode = "PAPER"
