name: AlgoOptionX validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run pytest -q -rs --junitxml=pytest-results.xml
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run build:research
      - run: npm --prefix apps/web run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm --prefix apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: algooptionx-validation
          path: |
            pytest-results.xml
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
  harness-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run algooptionx-harness validate-config
      - run: uv run pytest tests/control_plane -q -rs --junitxml=harness-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-contract-results
          path: harness-results.xml
