[project]
name = "dhan-analyzer"
version = "0.1.0"
description = "NIFTY option-chain sentiment/OI/trend/momentum analyzer on DhanHQ v2"
requires-python = ">=3.12"
dependencies = [
    "dhanhq>=2.2.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
dhan-analyzer = "dhan_analyzer.main:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dhan_analyzer*"]
