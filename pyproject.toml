[project]
name = "algooptionx"
version = "0.2.0"
description = "AlgoOptionX: NIFTY research, deterministic simulation and virtual paper trading"
requires-python = ">=3.12"
dependencies = [
    "dhanhq>=2.2.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.28.0", "hypothesis>=6.0.0"]

[project.scripts]
algooptionx = "algooptionx.api.app:run"
algooptionx-harness = "algooptionx_harness.cli:main"
algooptionx-research = "algooptionx.research.main:run"
dhan-analyzer = "algooptionx.research.main:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["algooptionx", "algooptionx.*", "algooptionx_harness", "algooptionx_harness.*"]

[tool.setuptools.package-data]
algooptionx_harness = ["agents/*.json", "schemas/*.json", "examples/*.json"]
